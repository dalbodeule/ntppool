services:
  ntpd:
    build:
      context: .
    image: dalbodeule/ntpd:latest
    container_name: ntpd
    restart: unless-stopped
    ports:
      - target: 123
        published: "123"
        host_ip: 0.0.0.0
        protocol: udp
      - target: 123
        published: "123"
        host_ip: "::"
        protocol: udp
    volumes:
      - ./ntpd.conf:/etc/ntp.conf:ro
      - ntpd-drift:/var/db
    cap_add:
      - SYS_TIME
      - NET_BIND_SERVICE
    environment:
      TZ: Asia/Seoul

volumes:
  ntpd-drift:
